<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Music Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
<style>
@property --c1{syntax:"<color>";inherits:true;initial-value:#ff2d95}
@property --c2{syntax:"<color>";inherits:true;initial-value:#6a2cff}
@property --c3{syntax:"<color>";inherits:true;initial-value:#00e5ff}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --ink:#f6f2ff;--sub:#a9a0c6;--glass:rgba(255,255,255,.07);--edge:rgba(255,255,255,.14);
  transition:--c1 .9s,--c2 .9s,--c3 .9s}
*{box-sizing:border-box}
html{min-height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:#0b0814;color:var(--ink);font-family:"Sora","Segoe UI",Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:20px}
.bg{position:fixed;inset:0;overflow:hidden;z-index:0}
.bg i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5;animation:drift 20s ease-in-out infinite alternate}
.bg i:nth-child(1){width:420px;height:420px;background:var(--c1);top:-120px;left:-100px}
.bg i:nth-child(2){width:380px;height:380px;background:var(--c2);bottom:-120px;right:-80px;animation-delay:-8s}
.bg i:nth-child(3){width:300px;height:300px;background:var(--c3);top:45%;left:48%;opacity:.3;animation-delay:-14s}
@keyframes drift{to{transform:translate(60px,-50px) scale(1.15)}}
.app{position:relative;z-index:1;width:100%;max-width:940px;display:grid;grid-template-columns:1fr 330px;gap:20px}
.player,.list{background:var(--glass);border:1px solid var(--edge);border-radius:32px;backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);box-shadow:0 40px 80px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.12)}
.player{padding:30px 34px;text-align:center}
.disc{width:min(250px,62vw);aspect-ratio:1;border-radius:50%;margin:0 auto 22px;position:relative;box-shadow:0 20px 60px color-mix(in srgb,var(--c1) 55%,transparent);animation:spin 14s linear infinite;animation-play-state:paused}
.disc.on{animation-play-state:running}
@keyframes spin{to{transform:rotate(360deg)}}
.disc .art{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 28% 26%,var(--c3),transparent 46%),radial-gradient(circle at 75% 80%,var(--c2),transparent 55%),linear-gradient(135deg,var(--c1),var(--c2))}
.disc .art::after{content:"";position:absolute;inset:0;border-radius:50%;background:repeating-radial-gradient(circle,transparent 0 4px,rgba(0,0,0,.09) 4px 5px)}
.disc .hole{position:absolute;inset:38%;border-radius:50%;background:#0b0814;border:6px solid rgba(255,255,255,.2)}
h1{font-size:26px;margin:0 0 4px;font-weight:700;letter-spacing:-.3px}
.artist{margin:0;color:var(--sub);font-size:15px}
#viz{width:100%;height:56px;display:block;margin:18px 0 6px}
.prog{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
.prog span{width:34px}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:6px;border-radius:99px;outline:none;cursor:pointer;background:linear-gradient(90deg,var(--c1),var(--c3)) 0/var(--p,0%) 100% no-repeat,rgba(255,255,255,.16)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.5)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:50%;background:#fff}
input[type=range]:focus-visible{outline:2px solid var(--c3);outline-offset:4px}
button{font:inherit;color:var(--ink);background:none;border:0;cursor:pointer;display:grid;place-items:center;transition:transform .12s,background .2s,color .2s}
button:active{transform:scale(.9)}
button:focus-visible{outline:2px solid var(--c3);outline-offset:3px}
svg{width:24px;height:24px;fill:currentColor}
.ctrl{display:flex;justify-content:center;align-items:center;gap:20px;margin:18px 0 14px}
.ctrl .s{width:42px;height:42px;border-radius:50%;color:var(--sub)}
.ctrl .s.act{color:var(--c3);background:var(--glass)}
.ctrl .n{width:48px;height:48px;border-radius:50%;background:var(--glass)}
.ctrl .p{width:74px;height:74px;border-radius:50%;background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 12px 30px color-mix(in srgb,var(--c1) 60%,transparent)}
.ctrl .p svg{width:34px;height:34px}
.vol{display:flex;align-items:center;gap:10px;max-width:240px;margin:0 auto;color:var(--sub)}
.vol button{width:32px;height:32px;color:var(--sub)}
.list{padding:22px 16px;display:flex;flex-direction:column;max-height:640px}
.lh{display:flex;justify-content:space-between;align-items:center;padding:0 10px 14px}
.lh h2{margin:0;font-size:18px}
.sw{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);cursor:pointer}
.sw input{appearance:none;-webkit-appearance:none;width:36px;height:20px;border-radius:99px;background:rgba(255,255,255,.2);position:relative;cursor:pointer;transition:background .2s}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .2s}
.sw input:checked{background:var(--c2)}.sw input:checked::after{transform:translateX(16px)}
ul{list-style:none;margin:0;padding:0;overflow:auto}
.item{width:100%;display:flex;align-items:center;gap:12px;padding:10px;border-radius:18px;text-align:left}
.item:hover{background:rgba(255,255,255,.06)}
.item.cur{background:rgba(255,255,255,.12)}
.thumb{width:48px;height:48px;border-radius:14px;flex:none;position:relative;display:grid;place-items:center}
.eq{display:none;gap:3px;align-items:flex-end;height:18px}
.item.cur .eq{display:flex}.item.cur.paused .eq b{animation-play-state:paused}
.eq b{width:3px;background:#fff;border-radius:2px;height:100%;animation:bar .8s ease-in-out infinite alternate}
.eq b:nth-child(2){animation-delay:-.3s}.eq b:nth-child(3){animation-delay:-.6s}
@keyframes bar{from{height:25%}}
.info{flex:1;min-width:0}
.info b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info span{font-size:12px;color:var(--sub)}
.d{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
@media (max-width:780px){.app{grid-template-columns:1fr}.list{max-height:none}.player{padding:24px 20px}}
@media (prefers-reduced-motion:reduce){.bg i,.disc,.eq b{animation:none}}
</style>
</head>
<body>
<div class="bg"><i></i><i></i><i></i></div>
<main class="app">
  <section class="player" aria-label="Music player">
    <div class="disc" id="disc"><div class="art"></div><div class="hole"></div></div>
    <h1 id="title">Title</h1>
    <p class="artist" id="artist">Artist</p>
    <canvas id="viz" aria-hidden="true"></canvas>
    <div class="prog"><span id="cur">0:00</span><input type="range" id="seek" min="0" max="1000" value="0" aria-label="Seek"><span id="dur">0:00</span></div>
    <div class="ctrl">
      <button class="s" id="shuf" aria-label="Shuffle" aria-pressed="false"></button>
      <button class="n" id="prev" aria-label="Previous song"></button>
      <button class="p" id="play" aria-label="Play"></button>
      <button class="n" id="next" aria-label="Next song"></button>
      <button class="s" id="rep" aria-label="Repeat playlist" aria-pressed="false"></button>
    </div>
    <div class="vol"><button id="mute" aria-label="Mute"></button><input type="range" id="vol" min="0" max="100" value="80" aria-label="Volume"></div>
  </section>
  <aside class="list">
    <div class="lh"><h2>Playlist</h2><label class="sw"><input type="checkbox" id="auto" checked>Autoplay</label></div>
    <ul id="pl"></ul>
  </aside>
</main>
<audio id="a" preload="auto"></audio>
<script>
(function(){
  /* Songs are generated in the browser so the page works with no audio files.
     To use real music, add a "src" (e.g. "songs/track1.mp3") to a track and it will be used instead. */
  var T=[
    {title:"Midnight Drive",artist:"Neon Harbor",bpm:100,bars:16,key:57,prog:[[0,1],[8,0],[3,0],[10,0]],arp:[0,1,2,3,2,1,2,1],wave:"saw",drums:1,col:["#ff2d95","#6a2cff","#00e5ff"]},
    {title:"Golden Hour",artist:"Solene Park",bpm:84,bars:12,key:55,prog:[[0,0],[5,0],[9,1],[7,0]],arp:[0,2,1,2,3,2,1,2],wave:"tri",drums:0,col:["#ffb347","#ff5e62","#ffe3b8"]},
    {title:"Paper Lanterns",artist:"Kite & Moth",bpm:72,bars:12,key:53,prog:[[0,0],[7,0],[9,1],[5,0]],arp:[0,1,2,1,3,2,1,2],wave:"sine",drums:0,col:["#7ae7c7","#3a86ff","#f9f871"]},
    {title:"Low Tide",artist:"Aya Marlowe",bpm:110,bars:16,key:50,prog:[[0,1],[10,0],[8,0],[7,0]],arp:[0,2,3,2,1,2,3,1],wave:"saw",drums:1,col:["#4cc9f0","#4361ee","#b5179e"]}
  ];
  var SR=22050;
  function mtof(m){return 440*Math.pow(2,(m-69)/12);}
  function synth(t){
    var beat=60/t.bpm,N=Math.floor(t.bars*4*beat*SR),buf=new Float32Array(N);
    function note(st,dur,f,vol,wave,atk,rel){
      var s0=Math.floor(st*SR),len=Math.floor((dur+rel)*SR);
      for(var i=0;i<len&&s0+i<N;i++){
        var tt=i/SR,env=Math.min(1,tt/atk);
        if(tt>dur)env*=Math.max(0,1-(tt-dur)/rel);
        var ph=6.2832*f*tt,x;
        if(wave==="tri")x=Math.asin(Math.sin(ph))*0.6366;
        else if(wave==="saw")x=(((f*tt)%1)*2-1)*0.5+Math.sin(ph)*0.5;
        else x=Math.sin(ph)+0.3*Math.sin(2*ph);
        buf[s0+i]+=x*env*vol;
      }
    }
    for(var b=0;b<t.bars;b++){
      var c=t.prog[b%t.prog.length],root=t.key+c[0],tones=[root,root+(c[1]?3:4),root+7,root+12],bs=b*4*beat,k;
      for(k=0;k<3;k++)note(bs,4*beat,mtof(tones[k]+12),0.05,"tri",0.3,0.6);
      note(bs,beat*1.8,mtof(root-12),0.2,"sine",0.01,0.2);
      note(bs+2*beat,beat*1.8,mtof(root-12),0.16,"sine",0.01,0.2);
      for(k=0;k<8;k++)note(bs+k*beat/2,beat*0.4,mtof(tones[t.arp[k%t.arp.length]]+12),0.07,t.wave,0.005,0.25);
      if(t.drums)for(k=0;k<4;k++){
        var s0=Math.floor((bs+k*beat)*SR),ph=0,i;
        for(i=0;i<0.2*SR&&s0+i<N;i++){var tt=i/SR;ph+=6.2832*(40+110*Math.exp(-tt*28))/SR;buf[s0+i]+=Math.sin(ph)*Math.exp(-tt*16)*0.4;}
        s0=Math.floor((bs+k*beat+beat/2)*SR);
        for(i=0;i<0.05*SR&&s0+i<N;i++)buf[s0+i]+=(Math.random()*2-1)*Math.exp(-i/SR*90)*0.05;
      }
    }
    var y=0,pk=0,i;
    for(i=0;i<N;i++){y+=0.4*(buf[i]-y);buf[i]=y;var fade=Math.min(1,(N-i)/(1.5*SR));buf[i]*=fade;if(Math.abs(buf[i])>pk)pk=Math.abs(buf[i]);}
    var out=new ArrayBuffer(44+N*2),v=new DataView(out);
    function ws(o,s){for(var j=0;j<s.length;j++)v.setUint8(o+j,s.charCodeAt(j));}
    ws(0,"RIFF");v.setUint32(4,36+N*2,true);ws(8,"WAVEfmt ");v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
    v.setUint32(24,SR,true);v.setUint32(28,SR*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);ws(36,"data");v.setUint32(40,N*2,true);
    for(i=0;i<N;i++)v.setInt16(44+i*2,Math.max(-1,Math.min(1,buf[i]/pk*0.85))*32767,true);
    return out;
  }
  var I={
    play:'<path d="M8 5v14l11-7z"/>',pause:'<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>',
    next:'<path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>',prev:'<path d="M6 6h2v12H6zM9.5 12l8.5 6V6z"/>',
    shuf:'<path d="M10.6 9.2L5.4 4 4 5.4l5.2 5.2 1.4-1.4zM14.5 4l2.1 2.1L4 18.6 5.4 20 18 7.4 20 9.5V4h-5.5zm.3 9.4l-1.4 1.4 3.1 3.1-2.1 2.1H20v-5.5l-2.1 2.1-3.1-3.2z"/>',
    rep:'<path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/>',
    vol:'<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4z"/>',
    mute:'<path d="M3 9v6h4l5 5V4L7 9H3zm13 .4l1.4-1.4 2.1 2.1 2.1-2.1 1.4 1.4-2.1 2.1 2.1 2.1-1.4 1.4-2.1-2.1-2.1 2.1-1.4-1.4 2.1-2.1z"/>'
  };
  function ic(el,n){el.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true">'+I[n]+'</svg>';}
  function $(id){return document.getElementById(id);}
  var a=$("a"),root=document.documentElement,idx=0,urls=[],shuffle=false,repeat=false,ctx,an,data,started=false;
  function fmt(s){if(!isFinite(s))return"0:00";var m=Math.floor(s/60),r=Math.floor(s%60);return m+":"+(r<10?"0":"")+r;}
  function dura(t){return t.bars*4*60/t.bpm;}
  function fill(el){el.style.setProperty("--p",(el.value/el.max*100)+"%");}
  ic($("shuf"),"shuf");ic($("prev"),"prev");ic($("next"),"next");ic($("rep"),"rep");ic($("play"),"play");ic($("mute"),"vol");

  var pl=$("pl");
  T.forEach(function(t,i){
    var li=document.createElement("li"),b=document.createElement("button");
    b.className="item";
    b.innerHTML='<span class="thumb" style="background:linear-gradient(135deg,'+t.col[0]+','+t.col[1]+')"><span class="eq"><b></b><b></b><b></b></span></span>'+
      '<span class="info"><b></b><span></span></span><span class="d">'+fmt(dura(t))+'</span>';
    b.querySelector(".info b").textContent=t.title;
    b.querySelector(".info span").textContent=t.artist;
    b.addEventListener("click",function(){if(i===idx)toggle();else load(i,true);});
    li.appendChild(b);pl.appendChild(li);
  });

  function load(i,play){
    idx=i;var t=T[i];
    if(t.src)a.src=t.src;
    else{if(!urls[i])urls[i]=URL.createObjectURL(new Blob([synth(t)],{type:"audio/wav"}));a.src=urls[i];}
    $("title").textContent=t.title;$("artist").textContent=t.artist;
    $("dur").textContent=fmt(dura(t));$("cur").textContent="0:00";$("seek").value=0;fill($("seek"));
    root.style.setProperty("--c1",t.col[0]);root.style.setProperty("--c2",t.col[1]);root.style.setProperty("--c3",t.col[2]);
    document.title=t.title+" · "+t.artist;
    [].forEach.call(pl.querySelectorAll(".item"),function(el,k){el.classList.toggle("cur",k===i);});
    if(play)a.play().catch(function(){});
  }
  function toggle(){unlock();if(a.paused)a.play().catch(function(){});else a.pause();}
  function step(dir,fromEnd){
    var n;
    if(shuffle&&T.length>1){do{n=Math.floor(Math.random()*T.length);}while(n===idx);}
    else{n=idx+dir;
      if(n>=T.length||n<0){
        if(fromEnd&&!repeat){load(0,false);return;}
        n=(n+T.length)%T.length;
      }}
    load(n,true);
  }
  function initAudio(){
    if(started)return;started=true;
    try{
      ctx=new (window.AudioContext||window.webkitAudioContext)();
      var s=ctx.createMediaElementSource(a);an=ctx.createAnalyser();an.fftSize=128;
      s.connect(an);an.connect(ctx.destination);data=new Uint8Array(an.frequencyBinCount);
    }catch(e){an=null;}
  }
  function unlock(){initAudio();if(ctx&&ctx.state==="suspended")ctx.resume();}
  document.addEventListener("pointerdown",unlock,true);
  document.addEventListener("keydown",unlock,true);
  a.addEventListener("play",function(){unlock();ic($("play"),"pause");$("play").setAttribute("aria-label","Pause");$("disc").classList.add("on");pl.classList.remove("paused");setPaused(false);});
  a.addEventListener("pause",function(){ic($("play"),"play");$("play").setAttribute("aria-label","Play");$("disc").classList.remove("on");setPaused(true);});
  function setPaused(p){var c=pl.querySelector(".item.cur");if(c)c.classList.toggle("paused",p);}
  a.addEventListener("timeupdate",function(){
    if(!a.duration)return;
    $("seek").value=a.currentTime/a.duration*1000;fill($("seek"));$("cur").textContent=fmt(a.currentTime);
  });
  a.addEventListener("loadedmetadata",function(){$("dur").textContent=fmt(a.duration);});
  a.addEventListener("ended",function(){if($("auto").checked)step(1,true);else{ic($("play"),"play");$("disc").classList.remove("on");}});
  $("seek").addEventListener("input",function(){fill(this);if(a.duration)a.currentTime=this.value/1000*a.duration;});
  $("play").addEventListener("click",toggle);
  $("next").addEventListener("click",function(){step(1,false);});
  $("prev").addEventListener("click",function(){if(a.currentTime>3)a.currentTime=0;else step(-1,false);});
  $("shuf").addEventListener("click",function(){shuffle=!shuffle;this.classList.toggle("act",shuffle);this.setAttribute("aria-pressed",shuffle);});
  $("rep").addEventListener("click",function(){repeat=!repeat;this.classList.toggle("act",repeat);this.setAttribute("aria-pressed",repeat);});
  $("vol").addEventListener("input",function(){fill(this);a.volume=this.value/100;a.muted=false;ic($("mute"),this.value==0?"mute":"vol");});
  $("mute").addEventListener("click",function(){a.muted=!a.muted;ic(this,a.muted?"mute":"vol");});
  document.addEventListener("keydown",function(e){
    if(e.target.tagName==="BUTTON"||e.target.tagName==="INPUT"&&e.target.type==="checkbox")return;
    if(e.code==="Space"){e.preventDefault();toggle();}
    else if(e.key==="ArrowRight"&&e.target.tagName!=="INPUT")step(1,false);
    else if(e.key==="ArrowLeft"&&e.target.tagName!=="INPUT")step(-1,false);
  });

  var cv=$("viz"),g=cv.getContext("2d"),bars=40,lvl=new Array(bars).fill(0);
  function size(){var d=window.devicePixelRatio||1;cv.width=cv.clientWidth*d;cv.height=cv.clientHeight*d;}
  window.addEventListener("resize",size);size();
  function draw(){
    var w=cv.width,h=cv.height,gap=w/bars,bw=gap*0.6,cs=getComputedStyle(root),i;
    g.clearRect(0,0,w,h);
    var gr=g.createLinearGradient(0,h,0,0);gr.addColorStop(0,cs.getPropertyValue("--c1"));gr.addColorStop(1,cs.getPropertyValue("--c3"));
    g.fillStyle=gr;
    if(an&&!a.paused)an.getByteFrequencyData(data);
    for(i=0;i<bars;i++){
      var target=(an&&!a.paused&&data)?data[Math.floor(i*0.75)]/255:0;
      lvl[i]+=(target-lvl[i])*0.25;
      var bh=Math.max(4*(window.devicePixelRatio||1),lvl[i]*h);
      g.beginPath();
      if(g.roundRect)g.roundRect(i*gap+(gap-bw)/2,h-bh,bw,bh,bw/2);else g.rect(i*gap+(gap-bw)/2,h-bh,bw,bh);
      g.fill();
    }
    requestAnimationFrame(draw);
  }
  a.volume=0.8;fill($("vol"));load(0,false);draw();
})();
</script>
</body>
</html>
